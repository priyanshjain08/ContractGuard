# UNVERIFIED: never executed on GitHub Actions.
name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @contractguard/db generate
      - run: pnpm typecheck
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: contractguard, POSTGRES_PASSWORD: contractguard, POSTGRES_DB: contractguard }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U contractguard" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://contractguard:contractguard@localhost:5432/contractguard
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @contractguard/db generate
      - run: pnpm --filter @contractguard/db exec prisma migrate deploy
      - run: psql "$DATABASE_URL" -f packages/db/prisma/sql/immutability.sql
      - run: pnpm --filter @contractguard/web exec playwright install --with-deps chromium
      - run: pnpm --filter @contractguard/web e2e
